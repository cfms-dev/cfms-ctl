[package]
name = "cfms-ctl"
version = "0.5.2"
edition = "2024"
description = "Standalone, high-performance, multi-database maintenance CLI for CFMS servers."
license = "Apache-2.0"
repository = "https://github.com/cfms-dev/cfms-ctl"

[lib]
name = "cfms_ctl"
path = "src/lib.rs"

[[bin]]
name = "cfms-ctl"
path = "src/main.rs"

[dependencies]
# CLI & Terminal UI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
comfy-table = "8.0"
console = "0.16"
dialoguer = "0.12"
indicatif = "0.18"

# Async Runtime & Multi-Database Backends (SQLite, MySQL, PostgreSQL)
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "sync", "time"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "mysql", "postgres", "chrono", "uuid", "json"], git = "https://github.com/transact-rs/sqlx", branch = "release/0.9.1" }
sea-query = { version = "1.0", features = ["backend-sqlite", "backend-mysql", "backend-postgres"] }

# Serialization & Lossless Config Editing
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
toml = "1.2"
toml_edit = "0.25"

# Cryptography, Hashing & Archives (for Backup/Deployment/User credentials)
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
hex = "0.4"
rand = "0.10"
sha2 = "0.11"

# System, File Locking, Time, Identifiers & Diagnostics
chrono = { version = "0.4", features = ["serde"] }
fs4 = "1.1"
semver = { version = "1.0", features = ["serde"] }
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
regex = "1.13.1"
self_update = { version = "1.3.3", default-features = false, features = ["async", "reqwest", "rustls", "github", "archive-tar", "compression-tar-xz", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums", "progress-bar"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
petgraph = "0.8.3"
strsim = "0.11.1"
pathfinding = "4.16.0"
minijinja = { version = "3.1.0", features = ["serde"] }
ruff_python_parser = "0.0.22"
ruff_python_ast = "0.0.22"
zstd = "0.14.4"
hkdf = "0.13.0"
rmp-serde = "1.3.1"
zeroize = "1.9.1"
pep440_rs = "0.7.3"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.11"
url = "2.5.9"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["sigv4a", "http-1x", "rt-tokio", "behavior-version-latest"] }
aws-config = { version = "1.13.2", default-features = false, features = ["rt-tokio", "credentials-process", "sso", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.5.2", default-features = false, features = ["default-client", "rt-tokio", "rustls-ring"] }
bytes = "1.12.1"

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
tempfile = "3.27"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"


# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Maintain CHANGELOG.md by prepending new releases onto the existing history:
#   git-cliff -u --bump --prepend CHANGELOG.md
#   git-cliff -u --tag vX.Y.Z --prepend CHANGELOG.md

[remote.github]
owner = "cfms-dev"
repo = "cfms-ctl"

[changelog]
header = """
# Changelog

All notable changes to `cfms-ctl` will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

<!-- git-cliff: end of header -->
"""
# Stable marker used by `--prepend` so the header is replaced cleanly across platforms and line endings.
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}
{% for commit in entry.commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}
{%- endfor %}
{% endfor -%}
{% if version and previous and previous.version %}
**Full Changelog**: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}..{{ version }}{%- endif %}\
"""
trim = false
render_always = true
postprocessors = [
    { pattern = '(\*\*Full Changelog\*\*: [^\n]+?)(## \[(?:Unreleased|\d))', replace = "${1}\n\n${2}" },
    { pattern = '(- [^\n]+?)(## \[(?:Unreleased|\d))', replace = "${1}\n\n${2}" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^refactor", group = "<!-- 2 -->Changed" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { body = ".*security", group = "<!-- 4 -->Security" },
    { message = "^doc", group = "<!-- 5 -->Documentation" },
    { message = "^style", group = "<!-- 6 -->Styling" },
    { message = "^test", group = "<!-- 7 -->Testing" },
    { message = "^revert", group = "<!-- 8 -->Removed" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore\\(changelog\\):", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^release:", skip = true },
    { message = "^chore|^ci|^build", group = "<!-- 9 -->Miscellaneous" },
    { message = "^Initial commit$", skip = true },
]
filter_commits = true
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
